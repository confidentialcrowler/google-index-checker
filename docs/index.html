<!doctype html>

  <head>
    <script>
      // GitHub Pages path & trailing slash normalization:
      // When hosted on GitHub Pages (e.g. https://<user>.github.io/<repo>),
      // if the URL lacks a trailing slash, relative paths like "./assets/..."
      // erroneously resolve to the domain root (causing 404s and blank screens).
      // This immediately ensures the trailing slash before modules load.
      (function() {
        try {
          var l = window.location;
          if (l.hostname.endsWith('github.io') || l.hostname.endsWith('pages.dev')) {
            var pathname = l.pathname;
            // If path does not end with / and does not point to an explicit file (.html, .js, etc.)
            if (pathname && !pathname.endsWith('/') && !pathname.split('/').pop().includes('.')) {
              l.replace(l.protocol + '//' + l.host + pathname + '/' + l.search + l.hash);
            }
          }
        } catch (e) {
          // Continue execution
        }
      })();
    </script>
