<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Crawlme Index Checker Tools</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirect 404 to index.html with query path, but NEVER redirect asset files
      (function() {
        var path = window.location.pathname;
        var isAsset = /\.(js|css|png|jpg|jpeg|gif|svg|json|ico|woff|woff2|ttf|eot|map)$/i.test(path);
        if (isAsset) {
          // Do not redirect asset 404s to avoid MIME type errors (e.g. Unexpected token '<')
          return;
        }

        var segments = path.split('/').filter(Boolean);
        // On username.github.io/repo/, segments[0] is the repository name
        var isGitHubPagesSubdir = window.location.hostname.endsWith('github.io') && segments.length > 0;
        var basePath = isGitHubPagesSubdir ? '/' + segments[0] + '/' : '/';
        
        window.location.replace(
          window.location.origin + basePath + window.location.search + window.location.hash
        );
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Crawlme Index Checker Tools...</p>
  </body>
</html>
