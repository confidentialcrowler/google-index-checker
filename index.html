<!doctype html>
<html lang="en">
  <head>
    <script>
      // GitHub Pages path & trailing slash normalization:
      // When hosted on GitHub Pages (e.g. https://<user>.github.io/<repo>),
      // if the URL lacks a trailing slash, relative paths like "./assets/..."
      // erroneously resolve to the domain root (causing 404s and blank screens).
      // This immediately ensures the trailing slash before modules load.
      (function() {
        try {
          var l = window.location;
          if (l.hostname.endsWith('github.io') || l.hostname.endsWith('pages.dev')) {
            var pathname = l.pathname;
            // If path does not end with / and does not point to an explicit file (.html, .js, etc.)
            if (pathname && !pathname.endsWith('/') && !pathname.split('/').pop().includes('.')) {
              l.replace(l.protocol + '//' + l.host + pathname + '/' + l.search + l.hash);
            }
          }
        } catch (e) {
          // Continue execution
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crawlme Index Checker Tools</title>
    <meta name="description" content="High-throughput Google URL index verification, multi-key API rotation with fallback, real-time bulk queue processor, SEO diagnostics, and Excel reporting." />
    <meta property="og:title" content="Crawlme Index Checker Tools" />
    <meta property="og:description" content="High-throughput Google URL index verification, multi-key API rotation with fallback, real-time bulk queue processor, SEO diagnostics, and Excel reporting." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>

    <script>
      // Fallback for when GitHub Pages is accidentally configured to serve from the repo root:
      // A static host cannot execute raw TypeScript (/src/main.tsx). If this uncompiled file
      // is served directly on GitHub Pages, immediately redirect to /docs/ where the compiled
      // production bundle resides.
      (function() {
        try {
          var l = window.location;
          var isStaticHost = l.hostname.endsWith('github.io') || l.hostname.endsWith('pages.dev');
          if (isStaticHost) {
            var isCompiled = document.querySelector('script[src*="assets/"]');
            var inDocs = l.pathname.includes('/docs');
            if (!isCompiled && !inDocs) {
              var base = l.pathname.endsWith('/') ? l.pathname : l.pathname + '/';
              l.replace(l.protocol + '//' + l.host + base + 'docs/' + l.search + l.hash);
            }
          }
        } catch (e) {}
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
